name: Unpack source
on:
  workflow_dispatch:
  push:
    paths:
      - source.zip
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o source.zip
          git rm -q --cached source.zip || true
          rm -f source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source files" || echo "Nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
