name: Sync update
on:
  workflow_dispatch:
  push:
    paths:
      - update.zip
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace project files from update.zip
        run: |
          set -e
          rm -rf /tmp/u && mkdir /tmp/u
          unzip -o -q update.zip -d /tmp/u
          if [ "$(ls -A /tmp/u | wc -l)" = "1" ] && [ -d "/tmp/u/$(ls -A /tmp/u)" ]; then src="/tmp/u/$(ls -A /tmp/u)"; else src=/tmp/u; fi
          [ -f "$src/index.html" ] || { echo "update.zip does not look like the project"; exit 1; }
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name Telegram-Together-Demo.mp4 ! -name update.zip -exec rm -rf {} +
          cp -a "$src"/. .
          rm -f update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update project files" || echo "Nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
