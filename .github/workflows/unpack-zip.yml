name: Unpack zip
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          for z in *.zip; do
            [ -e "$z" ] || continue
            rm -rf /tmp/x && mkdir /tmp/x
            unzip -o -q "$z" -d /tmp/x
            if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then src="/tmp/x/$(ls -A /tmp/x)"; else src=/tmp/x; fi
            cp -a "$src"/. .
            git rm -q --cached "$z" || true
            rm -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source files" || echo "Nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
